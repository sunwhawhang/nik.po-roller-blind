# Roller blind with guided, motor-time calibration. Replace both placeholder
# credentials before building. Home Wi-Fi is provisioned on the device.
substitutions:
  device_name: roller-blind
  friendly_name: Roller Blind

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - roller_motion.h
  on_boot:
    - priority: 600
      then:
        - lambda: 'esp_ota_mark_app_valid_cancel_rollback();'
    - priority: -100
      then:
        - lambda: |-
            id(motion_pref) = global_preferences->make_preference<roller::Snapshot>(0x72624c31);
            roller::Snapshot saved{};
            if (id(motion_pref).load(&saved)) roller::controller().restore(saved);
            id(motion_initialized) = true;
            id(blind).position = roller::controller().position();
            id(blind).publish_state(false);
  on_loop:
    then:
      - lambda: |-
          if (!id(motion_initialized)) return;
          auto &m = roller::controller();
          const uint32_t now = millis();
          m.tick(now);
          m.poll_physical(id(physical_up).state, id(physical_down).state, now);
          const bool was_active = id(motion_active);
          if (m.active() && !was_active && m.ready()) {
            // Mark the reference unknown on disk before applying any PWM.
            // An unexpected reset during a move then requires re-referencing.
            auto saved = m.snapshot(false);
            if (!id(motion_pref).save(&saved) || !global_preferences->sync()) m.fail(now);
          }
          const float pwm = m.duty();
          const int dir = pwm > 0 ? static_cast<int>(m.direction()) : 0;
          if (dir != id(applied_dir)) {
            id(motor_pwm).set_level(0);
            id(stby).turn_off();
            id(ain1).turn_off();
            id(ain2).turn_off();
            if (dir != 0) {
              if ((dir > 0) != id(reverse_motor)) id(ain2).turn_on();
              else id(ain1).turn_on();
              id(stby).turn_on();
            }
            id(applied_dir) = dir;
          }
          if (pwm != id(applied_pwm)) {
            id(motor_pwm).set_level(pwm);
            id(applied_pwm) = pwm;
          }
          const bool needs_save = m.take_save();
          if (needs_save || (was_active && !m.active() && m.ready())) {
            auto saved = m.snapshot(true);
            if (!id(motion_pref).save(&saved) || !global_preferences->sync()) m.fail(now);
          }
          const bool transitioned = was_active != m.active();
          id(motion_active) = m.active();
          if (transitioned || needs_save || now - id(motion_published) >= 200) {
            id(motion_published) = now;
            const auto op = m.direction() == roller::Dir::up ? COVER_OPERATION_OPENING :
                            m.direction() == roller::Dir::down ? COVER_OPERATION_CLOSING :
                            COVER_OPERATION_IDLE;
            if (id(blind).position != m.position() || id(blind).current_operation != op) {
              id(blind).position = m.position();
              id(blind).current_operation = op;
              id(blind).publish_state(false);
            }
          }

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  reboot_timeout: 0s
  encryption:
    key: "REPLACE-WITH-YOUR-OWN-GENERATED-KEY"
ota:
  - platform: esphome
    password: "REPLACE-WITH-YOUR-OWN-OTA-PASSWORD"

wifi:
  ap:
    ssid: Roller Blind Setup
    password: blindsetup
captive_portal:

web_server:
  port: 80
  version: 2
  css_include: www/custom.css
  css_url: ""
  js_include: www/custom.js
  js_url: ""

globals:
  - id: motion_pref
    type: esphome::ESPPreferenceObject
  - id: motion_initialized
    type: bool
    initial_value: 'false'
  - id: motion_active
    type: bool
    initial_value: 'false'
  - id: motion_published
    type: uint32_t
    initial_value: '0'
  - id: applied_dir
    type: int
    initial_value: '0'
  - id: applied_pwm
    type: float
    initial_value: '0.0'
  - id: swap_buttons
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: reverse_motor
    type: bool
    restore_value: true
    initial_value: 'false'

# Same ESP32-C3 / TB6612FNG wiring as the original build.
output:
  - platform: ledc
    pin: GPIO5
    id: motor_pwm
    frequency: 1000 Hz
switch:
  - platform: gpio
    pin: GPIO6
    id: ain2
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO7
    id: ain1
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO10
    id: stby
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: Swap Buttons
    id: btn_swap
    icon: mdi:swap-vertical
    restore_mode: DISABLED
    lambda: 'return id(swap_buttons);'
    turn_on_action:
      - globals.set:
          id: swap_buttons
          value: 'true'
    turn_off_action:
      - globals.set:
          id: swap_buttons
          value: 'false'
  - platform: template
    name: Reverse Motor
    id: motor_reverse
    icon: mdi:swap-horizontal
    restore_mode: DISABLED
    lambda: 'return id(reverse_motor);'
    turn_on_action:
      - lambda: |-
          if (!id(reverse_motor)) roller::controller().reset(millis());
          id(reverse_motor) = true;
    turn_off_action:
      - lambda: |-
          if (id(reverse_motor)) roller::controller().reset(millis());
          id(reverse_motor) = false;

script:
  - id: physical_button
    parameters:
      raw_up: bool
    then:
      - if:
          condition:
            lambda: 'return !roller::controller().ready();'
          then:
            - lambda: |-
                roller::controller().press_physical(
                    raw_up ? roller::Dir::up : roller::Dir::down,
                    id(swap_buttons), id(physical_up).state && id(physical_down).state, millis());
          else:
            - if:
                condition:
                  lambda: 'return roller::controller().active();'
                then:
                  - lambda: 'roller::controller().stop(millis());'
                  - homeassistant.event:
                      event: esphome.roller_master_stop
                      data: {}
                else:
                  - if:
                      condition:
                        lambda: 'return raw_up != id(swap_buttons);'
                      then:
                        - cover.open: blind
                        - homeassistant.event:
                            event: esphome.roller_master_up
                            data: {}
                      else:
                        - cover.close: blind
                        - homeassistant.event:
                            event: esphome.roller_master_down
                            data: {}

binary_sensor:
  - platform: gpio
    name: Button Up
    id: physical_up
    pin:
      number: GPIO20
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 50ms
    on_press:
      - script.execute:
          id: physical_button
          raw_up: true
  - platform: gpio
    name: Button Down
    id: physical_down
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 50ms
    on_press:
      - script.execute:
          id: physical_button
          raw_up: false

cover:
  - platform: template
    name: Blind
    id: blind
    device_class: shade
    assumed_state: true
    has_position: true
    open_action:
      - lambda: 'roller::controller().go(1.0f, millis());'
    close_action:
      - lambda: 'roller::controller().go(0.0f, millis());'
    position_action:
      - lambda: 'roller::controller().go(pos, millis());'
    stop_action:
      - lambda: 'roller::controller().stop(millis());'

text_sensor:
  - platform: template
    name: Calibration Status
    entity_category: diagnostic
    update_interval: 500ms
    lambda: 'return std::string(roller::controller().status());'

button:
  - platform: template
    name: Nudge Up
    icon: mdi:arrow-up
    on_press:
      - lambda: 'roller::controller().jog(roller::Dir::up, millis());'
  - platform: template
    name: Nudge Down
    icon: mdi:arrow-down
    on_press:
      - lambda: 'roller::controller().jog(roller::Dir::down, millis());'
  - platform: template
    name: Calibrate Closed
    icon: mdi:arrow-collapse-down
    on_press:
      - lambda: 'roller::controller().mark(roller::Dir::down, millis());'
  - platform: template
    name: Calibrate Open
    icon: mdi:arrow-collapse-up
    on_press:
      - lambda: 'roller::controller().mark(roller::Dir::up, millis());'
  - platform: template
    name: Start Calibration
    icon: mdi:tune
    on_press:
      - lambda: 'roller::controller().reset(millis());'
  - platform: template
    name: Stop
    icon: mdi:stop
    on_press:
      - cover.stop: blind
